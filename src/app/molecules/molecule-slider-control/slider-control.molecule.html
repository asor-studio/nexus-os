<div class="slider-control-container">
	<div class="slider-info">
		<lucide-icon class="slider-icon" [name]="icon"></lucide-icon>
		<span class="slider-label" *ngIf="label">{{ label | translate }}</span>
	</div>
	<div class="slider-wrapper">
		<input
			class="nx-range-input"
			[(ngModel)]="value"
			[min]="min"
			[max]="max"
			[step]="step"
			type="range"
		/>
		<span class="slider-value">{{ value }}%</span>
	</div>
</div>
